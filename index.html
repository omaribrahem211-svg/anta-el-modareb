<html lang="ar" dir="rtl">
  <head>
    <meta name="color-scheme" content="dark" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta property="og:title" content="أنت المدرب - Anta El Modareb" />
    <meta property="og:description" content="لعبة تدريب وإدارة كرة قدم مصرية تحاكي قيادة نادي في الدرجة الرابعة للصعود وتحقيق البطولات وبناء مسيرة تدريبية أسطورية." />
    <meta property="og:image" content="/anta_elmodareb_logo.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" media="print" onload="this.media='all'" crossorigin="anonymous">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" crossorigin="anonymous">
    </noscript>
    <script>
      // Old Android System WebView guard: the UI needs a modern WebView (Chrome 111+). On older ones the screen can stay white.
      (function () {
        try {
          var ok = window.CSS && CSS.supports && CSS.supports('color', 'color-mix(in srgb, red, blue)');
          if (ok) return;
          var m = /Chrome\/(\d+)/.exec(navigator.userAgent || '');
          var ver = m ? m[1] : '?';
          window.addEventListener('DOMContentLoaded', function () {
            if (sessionStorage.getItem('webview_warn_dismissed')) return;
            var d = document.createElement('div');
            d.setAttribute('dir', 'rtl');
            d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#0f172a;color:#fff;border-top:2px solid #f59e0b;padding:14px 16px;font:14px/1.6 sans-serif;text-align:right';
            d.innerHTML = '<b style="color:#fbbf24">تنبيه: نسخة WebView قديمة (' + ver + ')</b><br>للحصول على أفضل أداء وتفادي الشاشة البيضاء، حدّث «Android System WebView» من متجر Play.' +
              '<div style="margin-top:10px;display:flex;gap:8px"><a href="https://play.google.com/store/apps/details?id=com.google.android.webview" style="background:#f59e0b;color:#000;padding:8px 14px;border-radius:10px;font-weight:bold;text-decoration:none">تحديث الآن</a>' +
              '<button id="wvx" style="background:#334155;color:#fff;border:0;padding:8px 14px;border-radius:10px">متابعة</button></div>';
            document.body.appendChild(d);
            document.getElementById('wvx').onclick = function () { try { sessionStorage.setItem('webview_warn_dismissed', '1'); } catch (e) {} d.remove(); };
          });
        } catch (e) {}
      })();
    </script>
    <script>
      console.log('[STARTUP] index loaded', Math.round(performance.now()) + 'ms');
    </script>
    <style>
      html, body, #root {
        background-color: #020617 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 font-['Cairo',sans-serif] selection:bg-emerald-500 selection:text-white antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
