name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # 1. استخراج مفتاح التوقيع من Secrets
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-release-key.p12

      # 2. بناء الـ AAB مع تمرير رقم الإصدار التلقائي
      - name: Build Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      # 3. توقيع الـ AAB بمفتاحك الأصلي
      - name: Sign AAB
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore my-release-key.p12 \
            -storetype PKCS12 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            android/app/build/outputs/bundle/release/*.aab \
            "${{ secrets.KEY_ALIAS }}"

      # 4. التأكد من صحة التوقيع
      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs \
          android/app/build/outputs/bundle/release/*.aab

      # 5. رفع النسخة الموقعة لتنزيلها
      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: anta-el-modareb-signed-aab
          path: android/app/build/outputs/bundle/release/*.aab
          
