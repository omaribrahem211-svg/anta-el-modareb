name: Test Passwords

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode Keystore
        env:
          ENCODED_KEY: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ['ENCODED_KEY'].strip()
          with open('release.p12', 'wb') as f:
              f.write(base64.b64decode(raw))
          "

      - name: Try Known Passwords
        env:
          SECRET_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          passwords=("$SECRET_PASS" "android" "123456" "password" "omar" "")
          for p in "${passwords[@]}"; do
            echo "Testing password: [$p]"
            if keytool -list -keystore release.p12 -storepass "$p" 2>/dev/null; then
              echo "===> FOUND CORRECT PASSWORD: [$p] <==="
              exit 0
            fi
          done
          echo "None of the common passwords worked."
          exit 1
          
