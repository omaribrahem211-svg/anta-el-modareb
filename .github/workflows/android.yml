name: Build Android APK (Test)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Decode Keystore
        env:
          ENCODED_KEY: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64, re
          raw = os.environ.get('ENCODED_KEY', '')
          cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          cleaned = cleaned.rstrip('=')
          padding = (4 - len(cleaned) % 4) % 4
          if padding == 3:
              cleaned = cleaned[:-1]
              padding = 0
          cleaned += '=' * padding
          data = base64.b64decode(cleaned)
          with open('my-release-key.p12', 'wb') as f:
              f.write(data)
          "

      - name: Build Release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease -PautoVersionCode=${{ github.run_number }}

      - name: Sign APK
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore my-release-key.p12 \
            -storetype PKCS12 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "${{ secrets.KEY_ALIAS }}"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: anta-el-modareb-test-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          
