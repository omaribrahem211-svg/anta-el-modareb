name: Check Keystore Info

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode Keystore
        env:
          ENCODED_KEY: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64, re
          raw = os.environ.get('ENCODED_KEY', '').strip()
          cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          cleaned = cleaned.rstrip('=')
          padding = (4 - len(cleaned) % 4) % 4
          if padding == 3:
              cleaned = cleaned[:-1]
              padding = 0
          cleaned += '=' * padding
          data = base64.b64decode(cleaned)
          with open('release.keystore', 'wb') as f:
              f.write(data)
          print('File written successfully, size:', len(data))
          "

      - name: Inspect Keystore Details
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "=== 1. محاولة قراءة المفتاح بكلمة المرور ==="
          keytool -list -v -keystore release.keystore -storepass "$KS_PASS" || true
          
          echo "=== 2. عرض أسماء الـ Aliases مباشرة ==="
          keytool -list -keystore release.keystore -storepass "$KS_PASS" || true
          
