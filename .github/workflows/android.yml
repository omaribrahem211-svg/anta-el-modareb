name: Build Android APK (Test)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify rewarded consent and lifecycle regressions
        run: |
          node scripts/verify-rewarded-flow-208.mjs
          node scripts/verify-saved-squad-repair.mjs

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Record resolved mediation dependencies
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > mediation-dependencies.txt
          grep -E 'com.unity3d.ads:unity-ads:4.21.0|com.google.ads.mediation:unity:4.21.0.0|com.facebook.android:audience-network-sdk' mediation-dependencies.txt
          ./gradlew :app:dependencyInsight --dependency com.unity3d.ads:unity-ads --configuration releaseRuntimeClasspath

      - name: Decode Keystore
        env:
          ENCODED_KEY: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ['ENCODED_KEY'].strip()
          with open('${{ github.workspace }}/release.p12', 'wb') as f:
              f.write(base64.b64decode(raw))
          "

      - name: Build and Sign APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/release.p12" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify packaged Unity and Meta SDK classes
        run: python3 scripts/verify-mediation-apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Upload mediation dependency report
        uses: actions/upload-artifact@v4
        with:
          name: mediation-dependencies
          path: android/mediation-dependencies.txt

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: anta-el-modareb-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          
