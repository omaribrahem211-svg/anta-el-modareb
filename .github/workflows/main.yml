name: Build Android AAB (Google Play)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Decode Keystore
        env:
          ENCODED_KEY: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64, re
          raw = os.environ.get('ENCODED_KEY', '').strip()
          cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          cleaned = cleaned.rstrip('=')
          padding = (4 - len(cleaned) % 4) % 4
          if padding == 3:
              cleaned = cleaned[:-1]
              padding = 0
          cleaned += '=' * padding
          data = base64.b64decode(cleaned)
          with open('${{ github.workspace }}/my-release-key.jks', 'wb') as f:
              f.write(data)
          "

      - name: Build Release AAB
        working-directory: android
        run: chmod +x gradlew && ./gradlew bundleRelease -PautoVersionCode=${{ github.run_number }}

      - name: Sign AAB
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "${{ github.workspace }}/my-release-key.jks" \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            android/app/build/outputs/bundle/release/app-release.aab \
            "$ALIAS"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: anta-el-modareb-googleplay-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          
